<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="description" content="Dream Hair — The Curly Studio. Productos para rulos y método curly en Mendoza." />
    <title>Dream Hair · The Curly Studio</title>
    <link rel="icon" href="/img/marca/logocito.webp" type="image/webp" />
    <!-- LCP del home: la foto del hero se pide desde el HTML (no espera al JS) y solo en "/"
         (en las otras páginas no se usa). Si hay varias medidas, se agrega imagesrcset/imagesizes. -->
    <script>
      if (location.pathname === '/') {
        var l = document.createElement('link');
        l.rel = 'preload';
        l.as = 'image';
        l.href = '/img/mar/mar-con-productos-1.webp';
        l.setAttribute('fetchpriority', 'high');
        document.head.appendChild(l);
      }
    </script>
  </head>
  <body style="margin: 0; background: #f4efe6">
    <!-- Shell estático: pinta la marca antes de que cargue el JS (React lo reemplaza) -->
    <div id="root"><div style="display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 16px; font-family: Georgia, serif; color: #22382b">
        <img src="/img/marca/LOGO-sm.webp" alt="" width="40" height="40" style="border-radius: 50%; mix-blend-mode: multiply" />
        <span style="line-height: 1"><span style="display: block; font-size: 20px; font-weight: 600">Dream Hair</span><span style="display: block; margin-top: 3px; font: 700 10px system-ui, sans-serif; letter-spacing: 0.28em; color: #7e602b">THE CURLY STUDIO</span></span>
      </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
